[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edu247-email-analysis"
version = "0.1.0"
description = "EDU247 email analysis and orchestration service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["adapters*", "api*", "config*", "model*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
