[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-teaching-style"
version = "0.1.0"
description = "Teaching Style AI service starter scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["api*", "model*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
